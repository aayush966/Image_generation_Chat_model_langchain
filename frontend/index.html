<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Describe a picture or a short clip and an open-source model generates it, orchestrated with LangChain." />
    <title>ImageBot Studio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      /* Resolve the theme before first paint so a reload never flashes. */
      try {
        document.documentElement.dataset.theme = localStorage.getItem("imagebot.theme") || "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
